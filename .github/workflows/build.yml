name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Pregătire cheie de semnare
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Lipsește secretul KEYSTORE_B64" | tee build.log; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Compilare
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Scanner-1.${{ github.run_number }}.apk

      - name: Publicare în Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Scanner 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Scanner-1.${{ github.run_number }}.apk
          make_latest: true

      - name: Salvare jurnal la eroare
        if: failure()
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null
          tail -n 300 build.log > ci-log.txt 2>/dev/null || echo "fără jurnal" > ci-log.txt
          git add ci-log.txt
          git commit -m "log run ${{ github.run_number }}"
          git push -f origin ci-logs
